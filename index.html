import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ================= 基础场景 =================
const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, .1, 200);
camera.position.set(7, 5.2, 10);

const renderer = new THREE.WebGLRenderer({ antialias: true });

renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.3, 0);
controls.enableDamping = true;
controls.dampingFactor = .06;
controls.minDistance = 4;
controls.maxDistance = 24;
controls.maxPolarAngle = Math.PI / 2.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 1.1;
controls.addEventListener('start', () => controls.autoRotate = false);
controls.addEventListener('end', () => setTimeout(() => controls.autoRotate = true, 3000));

// ================= 光照 =================
const hemi = new THREE.HemisphereLight(0xcfe8ff, 0x8a7a5a, .85);

const sun = new THREE.DirectionalLight(0xfff0d0, 1.7);

sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8; sun.shadow.camera.bottom = -8;

const amb = new THREE.AmbientLight(0xffffff, .22);
scene.add(amb);

// ================= 日夜配色表 =================
const C = {
  skyTop:      { day: new THREE.Color(0x55aef0), night: new THREE.Color(0x0b1c3f) },
  skyHorizon:  { day: new THREE.Color(0xffd9a4), night: new THREE.Color(0x2a3a5e) },
  skyWarm:     { day: new THREE.Color(0xffb36b), night: new THREE.Color(0x3c4c6e) },
  fog:         { day: new THREE.Color(0xdceefb), night: new THREE.Color(0x14233a) },
  oceanDeep:   { day: new THREE.Color(0x3d7ea8), night: new THREE.Color(0x1b3a5c) },
  oceanShallow:{ day: new THREE.Color(0x55a8c8), night: new THREE.Color(0x2c5074) },
  oceanSunset: { day: new THREE.Color(0xff9a55), night: new THREE.Color(0x24334d) },
  sunCol:      { day: new THREE.Color(0xfff0d0), night: new THREE.Color(0x9db8ff) },
  hemiCol:     { day: new THREE.Color(0xcfe8ff), night: new THREE.Color(0x1e2c4c) },
  ambCol:      { day: new THREE.Color(0xffffff), night: new THREE.Color(0x556688) },
  sand:        { day: new THREE.Color(0xe9d7ab), night: new THREE.Color(0x9a8a68) },

};
const CUR = {};

// ================= 天空（落日渐变）=================
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(60, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: {
      topColor:    { value: new THREE.Color(C.skyTop.day) },
      horizonColor:{ value: new THREE.Color(C.skyHorizon.day) },
      warmColor:   { value: new THREE.Color(C.skyWarm.day) }
    },
    vertexShader: `
      varying vec3 vPos;
      void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }
    `,
    fragmentShader: `
      uniform vec3 topColor; uniform vec3 horizonColor; uniform vec3 warmColor;
      varying vec3 vPos;
      void main(){
        float h = normalize(vPos).y;
        vec3 col = mix(horizonColor, topColor, pow(clamp(h * 1.25 + .15, 0.0, 1.0), .55));
        float band = smoothstep(-.08, .22, h) * (1.0 - smoothstep(.18, .6, h));
        col = mix(col, warmColor, band * .85);
        gl_FragColor = vec4(col, 1.0);
      }
    `
  })
);
scene.add(sky);

{

// ================= 大海（着色器：波浪+波光+落日+浪花）=================
const ocean = new THREE.Mesh(
  new THREE.PlaneGeometry(90, 34, 120, 40),
  new THREE.ShaderMaterial({
    uniforms: {
      uTime:    { value: 0 },
      uDeep:    { value: new THREE.Color(C.oceanDeep.day) },
      uShallow: { value: new THREE.Color(C.oceanShallow.day) },
      uSunset:  { value: new THREE.Color(C.oceanSunset.day) },
      uNight:   { value: 0 },
      uCamPos:  { value: camera.position.clone() }
    },
    vertexShader: `
      uniform float uTime;
      varying vec3 vWorld; varying vec3 vNormal;
      void main(){
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        float wx = worldPos.x, wz = worldPos.z;
        float h = sin(wx * .5 + uTime * 1.1) * .16 + sin(wz * .7 - uTime * .8) * .12;
        worldPos.y += h;
        vec3 n = normalize(vec3(
          -0.5 * .16 * cos(wx * .5 + uTime * 1.1),
          1.0,
          -0.7 * .12 * cos(wz * .7 - uTime * .8)
        ));
        vNormal = normalize((modelMatrix * vec4(n, 0.0)).xyz);
        vWorld = worldPos.xyz;
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `,
    fragmentShader: `
      uniform vec3 uDeep; uniform vec3 uShallow; uniform vec3 uSunset;
      uniform float uNight; uniform vec3 uCamPos;
      varying vec3 vWorld; varying vec3 vNormal;
      void main(){
        vec3 n = normalize(vNormal);
        float slope = 1.0 - n.y;
        vec3 base = mix(uDeep, uShallow, clamp(slope * 4.0 + .2, 0.0, 1.0));
        // 金色波光
        float s1 = pow(max(sin(vWorld.x * 2.6 + uTime * 1.2) * sin(vWorld.z * 3.1 - uTime * 1.4), 0.0), 8.0);
        float s2 = pow(max(sin(vWorld.x * 11.0 - uTime * 2.2) * sin(vWorld.z * 12.0 + uTime * 1.8), 0.0), 12.0);
        vec3 col = base + vec3(1.0, .95, .75) * (s1 * .5 + s2 * .7);
        // 远处落日余晖
        float distZ = -vWorld.z;
        col = mix(col, uSunset, smoothstep(8.0, 30.0, distZ) * (1.0 - uNight));
        // 岸边浪花
        float shore = -vWorld.z - 5.0;
        float foam = (1.0 - smoothstep(0.0, .5, shore)) * .8 * (.6 + .4 * sin(uTime * 2.0));
        col = mix(col, vec3(.95, .97, 1.0), foam * .9);
        // 简单光照
        vec3 L = normalize(vec3(.5, 1.0, .3));
        float diff = clamp(dot(n, L), 0.0, 1.0);
        col *= .55 + diff * .9;
        gl_FragColor = vec4(col, 1.0);
      }
    `
  })
);
ocean.rotation.x = -Math.PI / 2;
ocean.position.set(0, -0.14, -22);

// ================= 门牌「熊的小屋」 =================
function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.arcTo(x + w, y, x + w, y + r, r);
  ctx.lineTo(x + w, y + h - r); ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h); ctx.arcTo(x, y + h, x, y + h - r, r);
  ctx.lineTo(x, y + r); ctx.arcTo(x, y, x + r, y, r);
  ctx.closePath();
}

const signCanvas = document.createElement('canvas');
signCanvas.width = 1024; signCanvas.height = 360;
{

// ================= 台词气泡（可换台词 + 打字机效果）=================
const LINES = [

let lineIdx = 0, typeT = 0, typing = true;

const bubCanvas = document.createElement('canvas');
bubCanvas.width = 640; bubCanvas.height = 420;
const bctx = bubCanvas.getContext('2d');
const bubTex = new THREE.CanvasTexture(bubCanvas);
bubTex.colorSpace = THREE.SRGBColorSpace;
bubTex.anisotropy = renderer.capabilities.getMaxAnisotropy();

function drawBubble(text) {
  bctx.clearRect(0, 0, 640, 420);
  bctx.save();
  bctx.shadowColor = 'rgba(0,0,0,.22)'; bctx.shadowBlur = 22; bctx.shadowOffsetY = 6;
  roundRectPath(bctx, 12, 12, 616, 396, 44);
  bctx.fillStyle = '#ffffff'; bctx.fill();
  bctx.restore();
  roundRectPath(bctx, 12, 12, 616, 396, 44);
  bctx.strokeStyle = '#3a3a3a'; bctx.lineWidth = 8; bctx.stroke();
  bctx.fillStyle = '#2b2b2b'; bctx.textAlign = 'center'; bctx.textBaseline = 'middle';
  bctx.font = 'bold 80px "Microsoft YaHei", "PingFang SC", sans-serif';
  // 按宽度换行
  const lines = [];
  let cur = '';
  for (const ch of text) {
    if (bctx.measureText(cur + ch).width > 560) { lines.push(cur); cur = ch; }
    else cur += ch;
  }
  if (cur) lines.push(cur);
  const lh = 96;
  const startY = (420 - lines.length * lh) / 2 + 58;
  lines.forEach((ln, i) => bctx.fillText(ln, 320, startY + i * lh));
  bubTex.needsUpdate = true;
}

// ================= 棕榈树 =================
function addPalm(x, z, s) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.08 * s, .13 * s, 1.5 * s, 8), mat(0x9c7a4a, 1));
  trunk.position.y = .75 * s;
  trunk.rotation.z = .14; trunk.rotation.x = -.06;
  trunk.castShadow = true;
  g.add(trunk);
  const top = new THREE.Group();
  top.position.set(.06, 1.5 * s, -.04);
  const leafMat = mat(0x3f9b4f, .8);
  for (let i = 0; i < 7; i++) {
    const leaf = new THREE.Mesh(new THREE.ConeGeometry(.34 * s, 1.15 * s, 4), leafMat);
    leaf.scale.set(1, 1, .16);
    const a = i / 7 * Math.PI * 2;
    leaf.position.set(Math.cos(a) * .22 * s, .05, Math.sin(a) * .22 * s);
    leaf.rotation.y = a;
    leaf.rotation.x = .42;
    top.add(leaf);
  }
  const coco = new THREE.Mesh(new THREE.SphereGeometry(.08 * s, 8, 6), mat(0x6b4a2b, .9));
  coco.position.set(.12, .12, 0);
  top.add(coco);
  g.add(top);
  g.position.set(x, 0, z);
  scene.add(g);
}
addPalm(-3.6, 1.8, 1.3);

{

// ================= 云 =================
const clouds = [];
function makeCloud(x, y, z, s) {
  const cg = new THREE.Group();
  const cm = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 1, flatShading: true });
  const puffs = [[0,0,.5],[-.6,.1,.35],[.6,.08,.4],[-.25,.22,.3],[.3,.2,.3]];
  for (const [px,py,pz] of puffs) {
    const puff = new THREE.Mesh(new THREE.SphereGeometry(pz * s, 10, 8), cm);
    puff.position.set(px * s, py * s, 0);
    cg.add(puff);
  }
  cg.position.set(x, y, z);
  cg.userData.speed = .12 + Math.random() * .15;
  scene.add(cg);
  clouds.push(cg);
}

// ================= 海鸥 =================
const gulls = [];
const gullMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: .8 });
function addGull(x, y, z) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(.08, 8, 6), gullMat);
  g.add(body);
  const wingGeo = new THREE.PlaneGeometry(.34, .09);
  const lw = new THREE.Mesh(wingGeo, gullMat);
  lw.position.set(-.18, 0, 0); lw.rotation.z = .2;
  const rw = new THREE.Mesh(wingGeo, gullMat);
  rw.position.set(.18, 0, 0); rw.rotation.z = -.2;
  g.add(lw); g.add(rw);
  g.userData = { lw, rw, speed: 1.4 + Math.random() * 1, seed: Math.random() * 10 };
  g.position.set(x, y, z);
  scene.add(g);
  gulls.push(g);
}
addGull(-6, 5.2, -3);
addGull(4, 6.1, -1);

// ================= 声音（海浪 + 轻音乐，纯本地合成）=================
let audioCtx = null, audioOn = false, masterGain = null;
const btnSound = document.getElementById('btnSound');
function ensureAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    masterGain = audioCtx.createGain();
    masterGain.gain.value = 0;
    masterGain.connect(audioCtx.destination);

    // 海浪：低频噪声 + 缓慢起伏
    const len = audioCtx.sampleRate * 4;
    const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      last = (last + 0.02 * (Math.random() * 2 - 1)) / 1.02;
      data[i] = last * 3.5;
    }
    const src = audioCtx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const lp = audioCtx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 420;
    const g = audioCtx.createGain(); g.gain.value = .5;
    const lfo = audioCtx.createOscillator(); lfo.frequency.value = .07;
    const lfoG = audioCtx.createGain(); lfoG.gain.value = .22;
    lfo.connect(lfoG); lfoG.connect(g.gain);
    src.connect(lp); lp.connect(g); g.connect(masterGain);
    src.start(); lfo.start();

    // 轻音乐（八音盒式旋律循环）
    const seq = [523.25, 587.33, 659.25, 523.25, 783.99, 880.00, 783.99, 659.25,
                 587.33, 659.25, 523.25, 440.00, 392.00, 440.00, 523.25, 587.33];
    let nextT = audioCtx.currentTime + .2, idx = 0, step = .42;
    function playNote(f, t) {
      const osc = audioCtx.createOscillator(); osc.type = 'sine'; osc.frequency.value = f;
      const osc2 = audioCtx.createOscillator(); osc2.type = 'sine'; osc2.frequency.value = f * 2;
      const g2 = audioCtx.createGain();
      g2.gain.setValueAtTime(0, t);
      g2.gain.linearRampToValueAtTime(.13, t + .03);
      g2.gain.exponentialRampToValueAtTime(.0001, t + .8);
      const g3 = audioCtx.createGain();
      g3.gain.setValueAtTime(0, t);
      g3.gain.linearRampToValueAtTime(.03, t + .02);
      g3.gain.exponentialRampToValueAtTime(.0001, t + .5);
      osc.connect(g2); osc2.connect(g3);
      g2.connect(masterGain); g3.connect(masterGain);
      osc.start(t); osc.stop(t + .85);
      osc2.start(t); osc2.stop(t + .55);
    }
    setInterval(() => {
      while (nextT < audioCtx.currentTime + .6) {
        playNote(seq[idx % seq.length], nextT);
        nextT += step; idx++;
      }
    }, 180);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
btnSound.addEventListener('pointerdown', e => { e.stopPropagation(); ensureAudio(); toggleSound(); });
function toggleSound() {
  audioOn = !audioOn;
  btnSound.textContent = audioOn ? '🔇 静音' : '🔊 声音';
}

// ================= 日夜切换按钮 =================
const btnMode = document.getElementById('btnMode');
btnMode.addEventListener('pointerdown', e => {
  e.stopPropagation();
  nightMode = !nightMode;
  btnMode.textContent = nightMode ? '☀️ 白天' : '🌙 夜晚';
});

// ================= 点击交互（点小熊聊天/点门/点窗户）=================
const bearMeshes = [], doorMeshes = [], winMeshes = [], bubMeshes = [];
bear.traverse(c => { if (c.isMesh) bearMeshes.push(c); });
doorGroup.traverse(c => { if (c.isMesh) doorMeshes.push(c); });
winGlasses.forEach(m => winMeshes.push(m));
bubble.traverse(c => { if (c.isMesh) bubMeshes.push(c); });
const clickable = [...bearMeshes, ...bubMeshes, ...doorMeshes, ...winMeshes];

const ray = new THREE.Raycaster();
const ndc = new THREE.Vector2();
renderer.domElement.addEventListener('pointerdown', e => {
  ensureAudio();
  ndc.x = (e.clientX / innerWidth) * 2 - 1;
  ndc.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(ndc, camera);
  const hits = ray.intersectObjects(clickable, false);
  if (hits.length) {
    const hit = hits[0].object;
    if (bearMeshes.includes(hit) || bubMeshes.includes(hit)) nextLine();
    else if (doorMeshes.includes(hit)) { doorOpen = !doorOpen; }
    else if (winMeshes.includes(hit)) winFlash = 1;
  }
});

// ================= 动画循环 =================
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta(), .1);

  controls.update();

  // 日夜渐变
  const k = dayFactor; // 1=白天
  for (const key in C) CUR[key].lerpColors(C[key].night, C[key].day, k);
  sky.material.uniforms.topColor.value.copy(CUR.skyTop);
  sky.material.uniforms.horizonColor.value.copy(CUR.skyHorizon);
  sky.material.uniforms.warmColor.value.copy(CUR.skyWarm);
  scene.fog.color.copy(CUR.fog);
  sun.color.copy(CUR.sunCol);
  sun.intensity = 1.7 * k + .35 * (1 - k);
  hemi.color.copy(CUR.hemiCol);
  hemi.intensity = .85 * k + .3 * (1 - k);
  amb.intensity = .22 * k + .08 * (1 - k);
  sand.material.color.copy(CUR.sand);
  deck.material.color.copy(CUR.deck);
  ocean.material.uniforms.uDeep.value.copy(CUR.oceanDeep);
  ocean.material.uniforms.uShallow.value.copy(CUR.oceanShallow);
  ocean.material.uniforms.uSunset.value.copy(CUR.oceanSunset);
  ocean.material.uniforms.uNight.value = 1 - k;
  ocean.material.uniforms.uCamPos.value.copy(camera.position);
  starsMat.opacity = 1 - k;
  moonMat.opacity = 1 - k;
  sunMesh.material.opacity = k;
  sunGlow.material.opacity = .75 * k;

  // 海浪时间
  ocean.material.uniforms.uTime.value = t;

  // 窗户灯光（呼吸 + 夜晚更亮 + 点击闪光）
  const nightBoost = 2.2 * (1 - k);
  winMat.emissiveIntensity = (1.1 + nightBoost) + Math.sin(t * 1.5) * .35 * (1 + (1 - k) * 1.4) + winFlash * 2.2;
  winFlash = Math.max(0, winFlash - dt * 2.5);

  // 门开关动画
  const doorTarget = doorOpen ? -1.5 : 0;
  doorRot += (doorTarget - doorRot) * Math.min(1, dt * 4);
  doorGroup.rotation.y = doorRot;

  // 台词打字机
  if (typing) {
    typeT += dt;
    const full = LINES[lineIdx];
    const n = Math.floor(typeT / .055);
    if (n >= full.length) { typing = false; drawBubble(full); }
    else drawBubble(full.slice(0, n));
  }

  // 小熊动作
  bear.position.y = Math.sin(t * 2) * .015;
  mouth.scale.x = typing ? .5 + .9 * Math.abs(Math.sin(t * 13)) : .75;
  if (gesture) {
    const el = t - gesture.t0;
    if (el > gesture.dur) { gesture = null; armL.rotation.z = .15; armR.rotation.z = -.15; head.rotation.x = 0; bearBody.position.y = 0; }
    else {
      const ease = 1 - el / gesture.dur;
      if (gesture.type === 'wave') {
        armR.rotation.z = -.15 - Math.sin(el * 10) * .75 * ease;
        armL.rotation.z = .15 + Math.sin(el * 10 + .8) * .3 * ease;
      } else if (gesture.type === 'nod') {
        head.rotation.x = Math.sin(el * 5) * .28 * ease;
      } else if (gesture.type === 'sit') {
        bearBody.position.y = -.16 * Math.sin(Math.PI * Math.min(el / gesture.dur, 1));
      } else if (gesture.type === 'spin') {
        bear.rotation.y += dt * 3.2;
      }
    }
  }

  // 气泡对准相机 + 浮动
  bubble.lookAt(camera.position);
  bubble.position.y = 2.05 + Math.sin(t * 1.6) * .04;

  // 云朵
  for (const c of clouds) {
    c.position.x -= dt * c.userData.speed;
    if (c.position.x < -9) c.position.x = 10;
  }

  // 海鸥
  for (const g of gulls) {
    g.position.x += dt * g.userData.speed;
    g.position.y += Math.sin(t * 1.2 + g.userData.seed) * .004;
    if (g.position.x > 13) g.position.x = -13;
    g.userData.lw.rotation.z = .2 + Math.sin(t * 9) * .45;
    g.userData.rw.rotation.z = -.2 - Math.sin(t * 9) * .45;
  }

  // 声音淡入淡出
  if (audioCtx && masterGain) {
    const target = audioOn ? .5 : 0;
    masterGain.gain.value += (target - masterGain.gain.value) * Math.min(1, dt * 3);
  }

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

setTimeout(() => {
  const l = document.getElementById('loader');
  if (l) { l.style.opacity = '0'; setTimeout(() => l && l.remove(), 700); }
}, 300);
