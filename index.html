<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>海边独墅 · 地中海白崖</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0e1a24;font-family:"PingFang SC","Microsoft YaHei",sans-serif}

  #ui button{border:1px solid rgba(255,255,255,.45);background:rgba(15,30,40,.45);color:#fff;font-size:13px;padding:7px 12px;border-radius:20px;cursor:pointer;backdrop-filter:blur(6px);transition:.25s}
  #ui button:hover{background:rgba(255,255,255,.25)}
  #tip{position:fixed;bottom:16px;left:0;right:0;text-align:center;color:rgba(255,255,255,.55);font-size:12px;z-index:10;pointer-events:none;letter-spacing:.5px}
  canvas{display:block;touch-action:none}
  @media(max-width:640px){#ui button{font-size:12px;padding:6px 10px}}

<script type="importmap">

<body>
<div id="app"></div>
<div id="ui">
  <button id="btnMode">☀ 日夜</button>
  <button id="btnSound">♪ 声音</button>
</div>
<div id="tip">拖拽旋转 · 点击蓝色大门可开关 · 点击窗户会亮灯</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const app = document.getElementById('app');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, .1, 400);
camera.position.set(15, 9, 16);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
app.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(2.2, 2.4, 0);
controls.enableDamping = true;
controls.dampingFactor = .07;
controls.minDistance = 6;
controls.maxDistance = 42;
controls.maxPolarAngle = Math.PI/2.05;
controls.autoRotate = true;
controls.autoRotateSpeed = .9;

// ===== 日夜配色 =====
const C = {
  skyTop:  {day:new THREE.Color(0x6fb8e8), night:new THREE.Color(0x050d1f)},
  skyHor:  {day:new THREE.Color(0xf2d9b8), night:new THREE.Color(0x13233f)},
  skyWarm: {day:new THREE.Color(0xf6a05c), night:new THREE.Color(0x2a1a3a)},
  fog:     {day:new THREE.Color(0xcfdbe8), night:new THREE.Color(0x0a1424)},
  oDeep:   {day:new THREE.Color(0x16638a), night:new THREE.Color(0x06182b)},
  oShal:   {day:new THREE.Color(0x4fc3c0), night:new THREE.Color(0x0c2838)},
  oSun:    {day:new THREE.Color(0xf0b56a), night:new THREE.Color(0x3a2a4a)},
  sunCol:  {day:new THREE.Color(0xfff3da), night:new THREE.Color(0x8fa9d8)},
  hemi:    {day:new THREE.Color(0xf6e8d8), night:new THREE.Color(0x3a4a6a)},
  amb:     {day:new THREE.Color(0x506a86), night:new THREE.Color(0x1a2436)},
  sand:    {day:new THREE.Color(0xe9d5a8), night:new THREE.Color(0x5a4a32)},
  rock:    {day:new THREE.Color(0xb8a89a), night:new THREE.Color(0x4a4238)},
  wall:    {day:new THREE.Color(0xf3ecdf), night:new THREE.Color(0x5c5666)},
  roof:    {day:new THREE.Color(0xc25a36), night:new THREE.Color(0x4a2c2c)},
  tile:    {day:new THREE.Color(0x2a6f97), night:new THREE.Color(0x16344f)},
  wood:    {day:new THREE.Color(0x8a5f3a), night:new THREE.Color(0x3a2c22)},
};
const CUR = new THREE.Color();
function lerp(k){ for(const key in C){ const o=C[key]; if(!o.cur) o.cur=new THREE.Color(); CUR.copy(o.night).lerp(o.day, k); o.cur.set(CUR.r, CUR.g, CUR.b); } }

// ===== 灯光 =====
const hemi = new THREE.HemisphereLight(0xf6e8d8, 0x4a5a6a, .8);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff3da, 2.2);
sun.position.set(14, 18, -8);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left=-20; sun.shadow.camera.right=20;
sun.shadow.camera.top=16; sun.shadow.camera.bottom=-16;
sun.shadow.camera.near=2; sun.shadow.camera.far=60;
scene.add(sun);
const amb = new THREE.AmbientLight(0x506a86, .55);
scene.add(amb);
scene.fog = new THREE.Fog(0x0a1424, 30, 130);

// ===== 天空 =====
const skyGeo = new THREE.SphereGeometry(180, 32, 16);
const skyMat = new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{top:{value:new THREE.Color()},hor:{value:new THREE.Color()},warm:{value:new THREE.Color()}},
  vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`varying vec3 vP; uniform vec3 top,hor,warm;
    void main(){ float h=normalize(vP).y; vec3 c;
      c=mix(warm,hor,smoothstep(-.05,.18,h));
      c=mix(c,top,smoothstep(.18,.62,h));
      gl_FragColor=vec4(c,1.0); }`
});
const sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);

// 太阳/月亮/星星
const sunBall = new THREE.Mesh(new THREE.SphereGeometry(1.6, 24, 16), new THREE.MeshBasicMaterial({color:0xfff3da, fog:false}));
sunBall.position.set(-38, 26, -30); scene.add(sunBall);
const glowMat = new THREE.SpriteMaterial({map:new THREE.CanvasTexture(glowCanvas()), color:0xffdca8, transparent:true, opacity:.85, blending:THREE.AdditiveBlending, depthWrite:false, fog:false});
const glow = new THREE.Sprite(glowMat); glow.scale.set(16,16,1); glow.position.copy(sunBall.position); scene.add(glow);
const moon = new THREE.Mesh(new THREE.SphereGeometry(1.2, 20, 14), new THREE.MeshBasicMaterial({color:0xd8e2ee, fog:false}));
moon.position.set(42, 24, -26); scene.add(moon);
function glowCanvas(){
  const c=document.createElement('canvas'); c.width=c.height=128; const x=c.getContext('2d');
  const g=x.createRadialGradient(64,64,4,64,64,64);
  g.addColorStop(0,'rgba(255,230,190,1)'); g.addColorStop(.3,'rgba(255,200,140,.5)'); g.addColorStop(1,'rgba(255,180,120,0)');
  x.fillStyle=g; x.fillRect(0,0,128,128); return c;
}
const starCount = 260;
const starPos = new Float32Array(starCount*3);
for(let i=0;i<starCount;i++){
  const th=Math.random()*Math.PI*2, ph=Math.acos(Math.random()*.9);
  starPos[i*3]=Math.cos(th)*Math.sin(ph)*170;
  starPos[i*3+1]=Math.sin(ph)*80+10;
  starPos[i*3+2]=Math.sin(th)*Math.sin(ph)*170;
}
const stars = new THREE.Points(new THREE.BufferGeometry().setAttribute('position', new THREE.BufferAttribute(starPos,3)),
  new THREE.PointsMaterial({color:0xdfe8ff, size:.7, transparent:true, opacity:0, fog:false}));
scene.add(stars);

// 云
function mkCloud(sx, sy, y){
  const g=new THREE.Group();
  for(let i=0;i<5;i++){
    const r=.9+Math.random()*.9;
    const m=new THREE.Mesh(new THREE.SphereGeometry(r,12,9),
      new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:.72, fog:false}));
    m.position.set(i*1.1-sx*.6, Math.random()*.4, (Math.random()-.5)*1.2);
    m.scale.set(1, .55, .8); g.add(m);
  }
  g.position.set(0, sy, 0); g.userData.speed=sx*.0008;
  return g;
}
const clouds=[mkCloud(6,17,-22), mkCloud(5,19,10), mkCloud(8,15,26), mkCloud(7,20,-40), mkCloud(5,13,44)];
clouds.forEach(c=>scene.add(c));

// ===== 海洋 =====
const oceanMat = new THREE.ShaderMaterial({
  uniforms:{
    uTime:{value:0}, uDeep:{value:new THREE.Color()}, uShal:{value:new THREE.Color()}, uSun:{value:new THREE.Color()},
    uNight:{value:0}, uCam:{value:new THREE.Vector3()}
  },
  vertexShader:`uniform float uTime; varying vec2 vUv; varying vec3 vN; varying vec3 vP;
    void main(){
      vUv=uv; vP=position;
      float w1=sin(position.x*.55+uTime*.9)*.5, w2=sin(position.z*.7+uTime*1.2)*.55, w3=sin((position.x+position.z)*.3+uTime*.6)*.3;
      vec3 p=position; p.y+=w1+w2+w3;
      vec3 dx=vec3(1., cos(position.x*.55+uTime*.9)*.55, 0.);
      vec3 dz=vec3(0., cos(position.z*.7+uTime*1.2)*.7, 1.);
      vN=normalize(cross(dz,dx));
      gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.0);
    }`,
  fragmentShader:`uniform float uTime,uNight; uniform vec3 uDeep,uShal,uSun; uniform vec3 uCam;
    varying vec2 vUv; varying vec3 vN; varying vec3 vP;
    void main(){
      vec3 n=normalize(vN);
      float d=length(vP.xz);
      vec3 col=mix(uDeep,uShal,smoothstep(34.,8.,d));
      float sp=pow(max(dot(n,normalize(vec3(.5,.9,.3))),0.),24.)*smoothstep(30.,8.,d);
      col+=uSun*sp*(.55+.45*uNight);
      col+=uSun*smoothstep(42.,20.,d)*.18*(1.-uNight);
      float foam=smoothstep(.32,.18,abs(vP.y))*smoothstep(14.,6.,d);
      col=mix(col,vec3(.95,.98,1.),foam*.6);
      float nd=length(uCam-vP); col*=exp(-nd*.004);
      gl_FragColor=vec4(col,1.0);
    }`
});
const ocean = new THREE.Mesh(new THREE.PlaneGeometry(240, 160, 96, 64), oceanMat);
ocean.rotation.x = -Math.PI/2;
ocean.position.y = .5;
scene.add(ocean);

// ===== 岩石台地 + 沙滩 =====
function rock(r, h, seed, pos, scl, matColor){
  const g=new THREE.DodecahedronGeometry(r, 0);
  const p=new THREE.Mesh(g, new THREE.MeshStandardMaterial({color:matColor, roughness:.95, flatShading:true}));
  const rnd=seed*999;
  for(let i=0;i<g.attributes.position.count;i++){
    g.attributes.position.setXYZ(i,
      g.attributes.position.getX(i)*(1+Math.sin(rnd+i*12.9898)*.3),
      g.attributes.position.getY(i)*(1+Math.sin(rnd*2+i*7.7)*.4),
      g.attributes.position.getZ(i)*(1+Math.sin(rnd*3+i*5.3)*.3));
  }
  g.computeVertexNormals();
  p.position.set(pos[0], pos[1], pos[2]);
  p.scale.set(scl[0], scl[1], scl[2]);
  p.castShadow = p.receiveShadow = true;
  return p;
}
const rockMat = new THREE.MeshStandardMaterial({color:0xb8a89a, roughness:.95, flatShading:true});
const cliff = new THREE.Mesh(new THREE.BoxGeometry(14, 4, 12), rockMat);
cliff.position.set(4.5, 1.2, .5); cliff.castShadow=cliff.receiveShadow=true; scene.add(cliff);
// 台地顶面
const plateau = new THREE.Mesh(new THREE.BoxGeometry(12.5, .8, 10), rockMat);
plateau.position.set(4.5, 3.3, .5); plateau.receiveShadow=true; scene.add(plateau);
// 斜向海边的坡（用旋转 box 堆出海岸线）
const slope = new THREE.Mesh(new THREE.BoxGeometry(12, 1, 10), rockMat);
slope.position.set(3.8, 2.1, .5); slope.rotation.z = .28; slope.castShadow=slope.receiveShadow=true; scene.add(slope);
// 沙滩
const sand = new THREE.Mesh(new THREE.CircleGeometry(5.2, 28), new THREE.MeshStandardMaterial({color:0xe9d5a8, roughness:1}));
sand.rotation.x = -Math.PI/2; sand.position.set(-2.2, .42, 3.4); sand.receiveShadow=true; scene.add(sand);
// 礁石
[
  [rock(1.1, .8, 3, [-1.4,.9,1.6], [1.5,1.1,1.2])],
  [rock(.7, .6, 7, [1.6,1.0,-2.8], [1.2,.9,1])],
  [rock(1.3, .9, 11, [-3.6,1.1,4.2], [1.6,1.2,1.3])],
  [rock(.5, .5, 13, [6.8,.9,3.4], [1,1,1])],
  [rock(.8, .6, 17, [-5.4,1.0,-1.8], [1.3,1,1.2])],
  [rock(.55,.5,19,[2.8,.85,5.6],[1,1,1])],
].forEach(a=>{ const r=a[0]; scene.add(r); });

// ===== 别墅 =====
const villa = new THREE.Group();
villa.position.set(4.5, 3.3, .5);
scene.add(villa);
const wallMat = new THREE.MeshStandardMaterial({color:0xf3ecdf, roughness:.7});
const wallShadow = new THREE.MeshStandardMaterial({color:0xd9cfc0, roughness:.8});
const roofMat = new THREE.MeshStandardMaterial({color:0xc25a36, roughness:.75, flatShading:true});
const tileMat = new THREE.MeshStandardMaterial({color:0x2a6f97, roughness:.5});
const woodMat = new THREE.MeshStandardMaterial({color:0x8a5f3a, roughness:.8});
const stoneMat = new THREE.MeshStandardMaterial({color:0x9a928a, roughness:.95});

// 石基
const base = new THREE.Mesh(new THREE.BoxGeometry(7.4, .7, 5.6), stoneMat);
base.position.set(0, .35, 0); base.castShadow=base.receiveShadow=true; villa.add(base);

// 主楼（白墙，带轻微斜面顶）
const mainWall = new THREE.Mesh(new THREE.BoxGeometry(5.2, 3.4, 4.4), wallMat);
mainWall.position.set(-.7, 2.35, 0); mainWall.castShadow=mainWall.receiveShadow=true; villa.add(mainWall);
// 主楼陶土双坡屋顶
const mainRoof = new THREE.Mesh(new THREE.ConeGeometry(3.6, 1.9, 4), roofMat);
mainRoof.position.set(-.7, 4.5, 0); mainRoof.rotation.y = Math.PI/4; mainRoof.castShadow=true; villa.add(mainRoof);
// 屋脊装饰
const ridge = new THREE.Mesh(new THREE.BoxGeometry(.18, .12, 4.4), new THREE.MeshStandardMaterial({color:0x8a3a24, roughness:.8}));
ridge.position.set(-.7, 5.42, 0); ridge.rotation.z = .1; villa.add(ridge);

// 右翼（悬挑露台的体块）
const wing = new THREE.Mesh(new THREE.BoxGeometry(3.1, 2.2, 3.6), wallMat);
wing.position.set(2.4, 1.8, 0); wing.castShadow=wing.receiveShadow=true; villa.add(wing);
// 右翼单坡屋顶
const wingRoof = new THREE.Mesh(new THREE.BoxGeometry(3.7, .5, 4.2), roofMat);
wingRoof.position.set(2.4, 3.15, 0); wingRoof.rotation.z = .42; wingRoof.castShadow=true; villa.add(wingRoof);

// 塔楼（瞭望阁）
const tower = new THREE.Mesh(new THREE.BoxGeometry(1.7, 2.6, 1.7), wallMat);
tower.position.set(-2.7, 1.7, 1.7); tower.castShadow=tower.receiveShadow=true; villa.add(tower);
const towerRoof = new THREE.Mesh(new THREE.ConeGeometry(1.25, 1.1, 4), roofMat);
towerRoof.position.set(-2.7, 3.55, 1.7); towerRoof.rotation.y = Math.PI/4; towerRoof.castShadow=true; villa.add(towerRoof);
// 塔楼小平台 + 旗杆 + 旗
const towerDeck = new THREE.Mesh(new THREE.BoxGeometry(1.9, .12, 1.9), woodMat);
towerDeck.position.set(-2.7, 3.1, 1.7); villa.add(towerDeck);
const pole = new THREE.Mesh(new THREE.CylinderGeometry(.05, .05, 1.5), woodMat);
pole.position.set(-2.7, 3.9, 1.7); villa.add(pole);
const flag = new THREE.Mesh(new THREE.PlaneGeometry(.9, .5), new THREE.MeshBasicMaterial({color:0x2a6f97, side:THREE.DoubleSide}));
flag.position.set(-2.42, 4.05, 1.7); villa.add(flag);

// 大门（地中海蓝拱门）——可点击
const doorGroup = new THREE.Group();
doorGroup.position.set(-1.2, 1.05, 2.201);
villa.add(doorGroup);
const doorMat = new THREE.MeshStandardMaterial({color:0x1d5f8a, roughness:.45, metalness:.15});
const door = new THREE.Mesh(new THREE.BoxGeometry(1.05, 2.1, .1), doorMat);
door.position.set(0, 1.05, 0); door.castShadow=true; doorGroup.add(door);
// 拱门头
const arch = new THREE.Mesh(new THREE.CylinderGeometry(.52, .52, .1, 16, 1, false, Math.PI, Math.PI), doorMat);
arch.position.set(0, 2.15, 0); arch.castShadow=true; doorGroup.add(arch);
// 门框
const frameMat = new THREE.MeshStandardMaterial({color:0xf6f0e6, roughness:.5});
const fr1 = new THREE.Mesh(new THREE.BoxGeometry(.16, 2.3, .16), frameMat); fr1.position.set(-.6, 1.15, 0); doorGroup.add(fr1);
const fr2 = new THREE.Mesh(new THREE.BoxGeometry(.16, 2.3, .16), frameMat); fr2.position.set(.6, 1.15, 0); doorGroup.add(fr2);
const fr3 = new THREE.Mesh(new THREE.BoxGeometry(1.4, .16, .16), frameMat); fr3.position.set(0, 2.35, 0); doorGroup.add(fr3);
// 门把手
const knob = new THREE.Mesh(new THREE.SphereGeometry(.07, 10, 8), new THREE.MeshStandardMaterial({color:0xd8b25a, metalness:.7, roughness:.3}));
knob.position.set(.36, 1.05, .08); doorGroup.add(knob);
// 门牌
const plate = new THREE.Mesh(new THREE.BoxGeometry(.5, .22, .05), new THREE.MeshStandardMaterial({color:0x5a4632, roughness:.7}));
plate.position.set(0, .55, .08); doorGroup.add(plate);
// 门牌文字（canvas 纹理）
const pCanvas=document.createElement('canvas'); pCanvas.width=128; pCanvas.height=56;
const pctx=pCanvas.getContext('2d');
pctx.fillStyle='#8a6a3a'; pctx.fillRect(0,0,128,56);
pctx.fillStyle='#f3ecdf'; pctx.font='bold 30px serif'; pctx.textAlign='center'; pctx.textBaseline='middle';
pctx.fillText('Villa', 64, 30);
const pTex=new THREE.CanvasTexture(pCanvas);
plate.material = new THREE.MeshStandardMaterial({map:pTex, roughness:.7});
doorGroup.add(plate);
// 门阶
const step1 = new THREE.Mesh(new THREE.BoxGeometry(1.8, .22, .8), stoneMat); step1.position.set(-1.2, .11, 2.65); villa.add(step1);
const step2 = new THREE.Mesh(new THREE.BoxGeometry(1.8, .18, .8), stoneMat); step2.position.set(-1.2, -.04, 3.35); villa.add(step2);
doorGroup.userData.baseRot = 0;
let doorOpen = 0;

// 窗户（可点击亮灯）
function mkWindow(x, y, z, ry, w, h){
  const g = new THREE.Group();
  g.position.set(x, y, z); g.rotation.y = ry; g.userData.flash = 0;
  const frame = new THREE.Mesh(new THREE.BoxGeometry(w+.16, h+.16, .12), frameMat);
  frame.position.set(0, 0, .04); frame.castShadow=true; g.add(frame);
  const glass = new THREE.Mesh(new THREE.BoxGeometry(w, h, .06), new THREE.MeshStandardMaterial({color:0x2a3b4a, roughness:.3, metalness:.2, emissive:0x2a3b4a, emissiveIntensity:.5}));
  glass.position.set(0, 0, .09); g.add(glass);
  // 百叶
  const louverMat = new THREE.MeshStandardMaterial({color:0x2a6f97, roughness:.6});
  const n = 5;
  for(let i=0;i<n;i++){
    const sl = new THREE.Mesh(new THREE.BoxGeometry(w*.86, .05, .04), louverMat);
    sl.position.set(0, (i-(n-1)/2)*(h*.13), .06);
    sl.rotation.x = -.35; g.add(sl);
  }
  // 窗台
  const sill = new THREE.Mesh(new THREE.BoxGeometry(w+.3, .08, .3), stoneMat);
  sill.position.set(0, -h/2-.08, .1); g.add(sill);
  villa.add(g);
  return g;
}
const winMain1 = mkWindow(-2.3, 2.7, 2.2, 0, .8, 1.0);
const winMain2 = mkWindow(1.1, 2.7, 2.2, 0, .8, 1.0);
const winTower = mkWindow(-2.7, 2.2, 2.55, 0, .6, .8);
const winWing  = mkWindow(3.95, 2.4, .0, Math.PI/2, .7, .9);

// 露台（悬挑板 + 铁艺栏杆）
const deck = new THREE.Mesh(new THREE.BoxGeometry(3.2, .16, 4.6), woodMat);
deck.position.set(3.9, 2.9, 0); deck.castShadow=deck.receiveShadow=true; villa.add(deck);
const railMat = new THREE.MeshStandardMaterial({color:0x3a4a4a, roughness:.6, metalness:.5});
for(let i=0;i<7;i++){
  const r = new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,1.1), railMat);
  r.position.set(3.9, 3.5, -1.9+i*.63); r.castShadow=true; villa.add(r);
}
const railTop = new THREE.Mesh(new THREE.BoxGeometry(3.2, .06, .06), railMat);
railTop.position.set(3.9, 4.02, -1.9); villa.add(railTop);
const railTop2 = new THREE.Mesh(new THREE.BoxGeometry(3.2, .06, .06), railMat);
railTop2.position.set(3.9, 4.02, 1.9); villa.add(railTop2);

// 露台家具：藤椅 + 圆桌 + 柠檬树
function mkChair(x, z, ry){
  const g=new THREE.Group(); g.position.set(x, 2.98, z); g.rotation.y=ry;
  const seat=new THREE.Mesh(new THREE.BoxGeometry(.9,.12,.72), woodMat); seat.position.y=.06; g.add(seat);
  const back=new THREE.Mesh(new THREE.BoxGeometry(.9,.6,.06), woodMat); back.position.set(0,.42,-.33); g.add(back);
  for(let i=0;i<4;i++){
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(.025,.025,.5), woodMat);
    leg.position.set(i<2?-.4:.4, -.16, i%2===0?-.3:.3); g.add(leg);
  }
  return g;
}
villa.add(mkChair(3.4, -.9, .4));
villa.add(mkChair(4.5, -.9, -.4));
const ttable = new THREE.Mesh(new THREE.CylinderGeometry(.34, .4, .06, 12), woodMat);
ttable.position.set(3.95, 2.96, -1.1); villa.add(ttable);
const lemMat = new THREE.MeshStandardMaterial({color:0x8aa94c, roughness:.9});

      new THREE.Vector3(.05, 1.7+i*.2, .1), new THREE.Vector3(-.1, 2.5+i*.2, 0)

// ===== 交互 =====
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const clickables = [door, arch, doorGroup, winMain1, winMain2, winTower, winWing];
renderer.domElement.addEventListener('pointerdown', e=>{
  ensureAudio();
  pointer.x = (e.clientX/innerWidth)*2-1;
  pointer.y = -(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(clickables, true);
  if(hit.length){
    let obj = hit[0].object;
    while(obj && !obj.userData && obj.parent) obj = obj.parent;
    if(obj === door || obj === arch || obj === doorGroup) doorOpen = doorOpen>0 ? 0 : 1;
    else obj.userData.flash = 1;
  }
});

// ===== 声音（海浪 + 海风风铃）=====
let audioCtx=null, masterGain=null, soundOn=false;
function ensureAudio(){
  if(!audioCtx){
    audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    masterGain=audioCtx.createGain(); masterGain.gain.value=0; masterGain.connect(audioCtx.destination);
    // 海浪：低频噪声 + 低通 + LFO 起伏
    const len=audioCtx.sampleRate*4, buf=audioCtx.createBuffer(1, len, audioCtx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++){ const t=i/audioCtx.sampleRate; d[i]=(Math.random()*2-1)*(.25+.75*Math.abs(Math.sin(t*.5))); }
    const src=audioCtx.createBufferSource(); src.buffer=buf; src.loop=true;
    const lp=audioCtx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=380;
    const lfo=audioCtx.createOscillator(); lfo.frequency.value=.08;
    const lfoG=audioCtx.createGain(); lfoG.gain.value=.18;
    lfo.connect(lfoG); lfoG.connect(lp.frequency); lfo.start();
    src.connect(lp); lp.connect(masterGain); src.start();
    // 风铃：随机高音 ping
    scheduleBells();
  }
  audioCtx.resume();
}
function scheduleBells(){
  if(!soundOn) return;
  const now=audioCtx.currentTime;
  const t=now+Math.random()*4+2;
  const osc=audioCtx.createOscillator(), g=audioCtx.createGain();
  osc.type='sine'; osc.frequency.value=1200+Math.random()*900;
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(.05,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+2.5);
  osc.connect(g); g.connect(masterGain);
  osc.start(t); osc.stop(t+3);
  setTimeout(scheduleBells, (t-now)*1000);
}
const btnMode=document.getElementById('btnMode');
const btnSound=document.getElementById('btnSound');
let nightMode=false;
let kCurrent = 1;
btnMode.addEventListener('click', ()=>{ nightMode=!nightMode; btnMode.textContent=nightMode?'☾ 日夜':'☀ 日夜'; });
btnSound.addEventListener('click', ()=>{
  soundOn=!soundOn;
  if(soundOn){ ensureAudio(); masterGain.gain.linearRampToValueAtTime(.5, audioCtx.currentTime+1.2); }
  else if(masterGain) masterGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime+.6);
  btnSound.textContent=soundOn?'♪ 声音':'♩ 声音';
});

// ===== 动画循环 =====
const clock=new THREE.Clock();
function animate(){
  const dt=Math.min(clock.getDelta(), .05);
  const t=clock.elapsedTime;
  // 日夜渐变（k=白天程度，nightMode=false 白天→k=1；nightMode=true 夜晚→k=0，缓动过渡）
  const kTarget = nightMode ? 0 : 1;
  kCurrent += (kTarget - kCurrent) * Math.min(1, dt * 2.2);
  const k = kCurrent;
  lerp(k);
  scene.fog.color.copy(C.fog.cur);
  skyMat.uniforms.top.value.copy(C.skyTop.cur);
  skyMat.uniforms.hor.value.copy(C.skyHor.cur);
  skyMat.uniforms.warm.value.copy(C.skyWarm.cur);
  sunBall.material.color.copy(C.sunCol.cur); sunBall.material.transparent=true; sunBall.material.opacity=k;
  glow.material.opacity=k*.85;
  moon.material.opacity=1-k; moon.material.transparent=true;
  stars.material.opacity=(1-k)*.9;
  hemi.color.copy(C.hemi.cur); sun.color.copy(C.sunCol.cur); amb.color.copy(C.amb.cur);
  sun.intensity = 1.2+1.4*k;
  hemi.intensity = .35+.7*k;
  oceanMat.uniforms.uDeep.value.copy(C.oDeep.cur);
  oceanMat.uniforms.uShal.value.copy(C.oShal.cur);
  oceanMat.uniforms.uSun.value.copy(C.oSun.cur);
  oceanMat.uniforms.uNight.value = 1-k;
  oceanMat.uniforms.uCam.value.copy(camera.position);
  rockMat.color.copy(C.rock.cur); sand.material.color.copy(C.sand.cur);
  wallMat.color.copy(C.wall.cur); wallShadow.color.copy(C.wall.cur).multiplyScalar(.86);
  roofMat.color.copy(C.roof.cur); tileMat.color.copy(C.tile.cur); woodMat.color.copy(C.wood.cur);

  // 云
  clouds.forEach(c=>{ c.position.x += c.userData.speed*60*dt; if(c.position.x>70) c.position.x=-70; });

  // 门开关
  const target = doorOpen>0 ? -1.5 : 0;
  doorGroup.userData.baseRot += (target-doorGroup.userData.baseRot)*Math.min(1, dt*3.5);
  doorGroup.rotation.y = doorGroup.userData.baseRot;

  // 窗闪光 + 夜间窗灯
  [winMain1, winMain2, winTower, winWing].forEach(w=>{
    const g=w.children.find(c=>c.geometry.type==='BoxGeometry' && c.material.emissive && c.material.emissive.getHex() !== 0);
    if(g){
      g.material.emissiveIntensity = .5 + (1-k)*1.4 + (w.userData.flash>0 ? w.userData.flash*3 : 0);
      w.userData.flash = Math.max(0, w.userData.flash - dt*1.6);
    }
  });

  // 床单摆动
  sheets.children.forEach((s,i)=>{
    s.rotation.z = Math.sin(t*1.4+s.userData.phase)*.05;
    s.rotation.x = Math.sin(t*1.1+s.userData.phase*.7)*.03;
  });

  // 旗
  flag.rotation.y = Math.sin(t*2.2)*.3; flag.position.x = -2.42 + Math.sin(t*2.2)*.02;

  // 帆船漂移
  boat.position.x += boat.userData.head*dt*1.1;
  boat.position.z += Math.sin(t*.3)*dt*.3;
  if(boat.position.x < -42) boat.userData.head = 1;
  if(boat.position.x > -10) boat.userData.head = -1;
  boat.rotation.y = boat.userData.head*.12;
  sail1.rotation.z = Math.sin(t*.9)*.1;
  sail2.rotation.z = Math.sin(t*.9+.8)*.1;

  // 海鸥
  gulls.forEach((gu,i)=>{
    gu.userData.flap += dt*10;
    const fl = Math.sin(gu.userData.flap)*.55;
    gu.children[0].rotation.z = fl;
    gu.children[1].rotation.z = -fl;
    gu.position.x += Math.sin(t*.4+i*2)*dt*.8;
    gu.position.y += Math.sin(t*.9+i*1.3)*dt*.5;
  });

  oceanMat.uniforms.uTime.value = t;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}
animate();
addEventListener('resize', ()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
